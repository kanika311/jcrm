# ==============================================================================
# Apache 2.4 Virtual Host Configuration for JCRM Technologies
# Domain: https://www.jcrm.in/
# Upstream: Next.js (port 3000)
# Hardened according to Application Security Standards
# ==============================================================================

# Global Server Configuration (place in apache2.conf / httpd.conf or VirtualHost)
ServerTokens Prod
ServerSignature Off

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Redirect All Traffic to HTTPS
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName jcrm.in
    ServerAlias www.jcrm.in

    # Unset technology fingerprinting headers
    Header always unset X-Powered-By
    Header unset X-Powered-By
    Header unset Server

    # 301 Permanent Redirect to Canonical HTTPS FQDN
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://www.jcrm.in$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/jcrm_http_error.log
    CustomLog ${APACHE_LOG_DIR}/jcrm_http_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# HTTPS (Port 443) -> Reverse Proxy to Next.js Upstream
# ------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName jcrm.in
    ServerAlias www.jcrm.in

    # Canonical redirect non-www to www.jcrm.in
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^jcrm\.in$ [NC]
    RewriteRule ^(.*)$ https://www.jcrm.in$1 [R=301,L]

    # SSL / TLS Modern Hardening (Task 7)
    # Strictly disable TLS 1.0, 1.1, and SSLv3
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off
    SSLCompression off

    # SSL Certificate Paths (Let's Encrypt / Custom)
    SSLCertificateFile /etc/letsencrypt/live/www.jcrm.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.jcrm.in/privkey.pem

    # --------------------------------------------------------------------------
    # Technology Disclosure Hardening (Task 4)
    # --------------------------------------------------------------------------
    Header always unset X-Powered-By
    Header unset X-Powered-By
    Header unset Server
    Header always unset Server

    <IfModule mod_security2.c>
        SecRuleEngine On
        SecServerSignature ""
    </IfModule>

    # --------------------------------------------------------------------------
    # Reverse Proxy to Next.js upstream
    # Note: Security headers (CSP, Permissions-Policy, HSTS, X-Content-Type-Options)
    # are authoritatively set by Next.js proxy.ts to ensure dynamic per-request nonces
    # are not duplicated or corrupted. Apache forwards upstream headers cleanly.
    # --------------------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s

    # Forward WebSocket connections for HMR / real-time features
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    # Proxy all traffic to Next.js node application
    ProxyPass / http://127.0.0.1:3000/ retry=1 acquire=3000 timeout=600 Keepalive=On
    ProxyPassReverse / http://127.0.0.1:3000/

    # Logging
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/jcrm_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/jcrm_ssl_access.log combined
</VirtualHost>

